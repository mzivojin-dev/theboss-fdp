name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit tests (Core / Data / Pdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run tests
        run: dotnet test tests/FoaieDeParcurs.Tests/FoaieDeParcurs.Tests.csproj --configuration Release

  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore src/FoaieDeParcurs.App/FoaieDeParcurs.App.csproj

      - name: Build Debug APK
        run: dotnet build src/FoaieDeParcurs.App/FoaieDeParcurs.App.csproj -c Debug -f net10.0-android

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoaieDeParcurs-Debug-APK
          path: src/FoaieDeParcurs.App/bin/Debug/net10.0-android/*.apk
          if-no-files-found: error
